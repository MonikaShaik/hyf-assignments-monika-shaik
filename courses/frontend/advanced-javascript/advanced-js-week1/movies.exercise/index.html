<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>MOVIES</h1>

    <div class="card">
      <h2 class="card-header">Short title movies</h2>
      <pre id="shortTitles"></pre>
    </div>

    <div class="card">
      <h2 class="card-header">Long movie titles</h2>
      <pre id="longTitles"></pre>
    </div>

    <div class="card">
      <h2 class="card-header">Movies from the 1980s</h2>
      <pre id="count80s"></pre>
    </div>

    <div class="card">
      <h2 class="card-header">Tagged movies</h2>
      <pre id="taggedMovies"></pre>
    </div>

    <div class="card">
      <h2 class="card-header">Ratings over 6</h2>
      <pre id="ratingsOver6"></pre>
    </div>

    <div class="card">
      <h2 class="card-header">Keyword count</h2>
      <pre id="keywordCount"></pre>
    </div>

    <div class="card">
      <h2 class="card-header">Duplicated-word titles</h2>
      <pre id="duplicatedWords"></pre>
    </div>

    <script src="movies-list.js"></script>
    <script src="script.js"></script>
  </body>
</html>
